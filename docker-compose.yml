version: "3.3"

services:
  server:
    build: .
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
      - "5005:5005"
    environment:
      - SERVER_PORT=${SERVER_PORT}
      - DATABASE_CONNECTION_STRING=${DATABASE_CONNECTION_STRING}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KTOR_ENV=local
    depends_on:
      - db
    networks:
      - db_network
    restart: always

  db:
    image: ${POSTGRES_IMAGE}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      - POSTGRES_DB=artemmovchan
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./db-data:/var/lib/postgresql/data
    networks:
      - db_network
    restart: always

networks:
  db_network:
    driver: bridge