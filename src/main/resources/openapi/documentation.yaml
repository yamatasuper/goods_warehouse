openapi: 3.0.0
info:
  title: Product API
  version: 1.0.0
  description: API для загрузки данных о продуктах и складах
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sku:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: number
          format: double
        quantity:
          type: integer
        lastQuantityUpdate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          description: Имя пользователя
        email:
          type: string
          format: email
          description: Электронная почта
        password:
          type: string
          format: password
          description: Пароль пользователя
    RegisterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор зарегистрированного пользователя
        username:
          type: string
          description: Имя пользователя
paths:
  /loadWarehouses:
    get:
      summary: Получение списка продуктов
      operationId: getProducts
      responses:
        '200':
          description: Успешный ответ с данными о продуктах
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          description: Ошибка на сервере
  /register:
    post:
      summary: Регистрация нового пользователя
      operationId: registerNewUser
      requestBody:
        description: Данные для регистрации нового пользователя
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Некорректные данные запроса
        '500':
          description: Ошибка на сервере
