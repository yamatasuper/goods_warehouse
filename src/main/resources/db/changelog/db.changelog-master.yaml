databaseChangeLog:
  - changeSet:
      id: 1
      author: aleks_usharovskii
      changes:
        - createTable:
            tableName: user
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(255)
              - column:
                  name: last_name
                  type: varchar(255)
              - column:
                  name: email
                  type: varchar(255)

  - changeSet:
      id: 2
      author: aleks_usharovskii
      changes:
        - insert:
            tableName: user
            columns:
              - column:
                  name: username
                  value: "john_doe"
              - column:
                  name: password
                  value: "password123"
              - column:
                  name: first_name
                  value: "John"
              - column:
                  name: last_name
                  value: "Doe"
              - column:
                  name: email
                  value: "john.doe@example.com"

  - changeSet:
      id: 3
      author: aleks_usharovskii
      changes:
