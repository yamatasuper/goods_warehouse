              - column:
                  name: username
                  value: "jane_smith"
              - column:
                  name: password
                  value: "securepassword"
              - column:
                  name: first_name
                  value: "Jane"
              - column:
                  name: last_name
                  value: "Smith"
              - column:
                  name: email
                  value: "jane.smith@example.com"

  - changeSet:
      id: 4
      author: aleks_usharovskii
      changes:
        - insert:
            tableName: user
            columns:
              - column:
                  name: username
                  value: "alice_williams"
              - column:
                  name: password
                  value: "alicepassword"
              - column:
                  name: first_name
                  value: "Alice"
              - column:
                  name: last_name
                  value: "Williams"
              - column:
                  name: email
                  value: "alice.williams@example.com"
