spring:
  liquibase:
    enabled: false
  datasource:
    # Увеличиваем кеш
    url: jdbc:h2:mem:goods-warehouse-local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;TRACE_LEVEL_FILE=0;CACHE_SIZE=4194304;MAX_MEMORY_ROWS=1000000;MAX_MEMORY_UNDO=1000000;INIT=RUNSCRIPT FROM 'classpath:schema.sql'


    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.H2Dialect
      properties:
        hibernate:
          show_sql: true
          format_sql: true
          use_sql_comments: true
          order_inserts: true  # Order inserts to optimize batch processing

    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true