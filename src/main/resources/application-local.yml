spring:
  liquibase:
    enabled: false
  datasource:
    url: jdbc:h2:mem:goods-warehouse-local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;TRACE_LEVEL_FILE=0;CACHE_SIZE=65536;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
    username: sa
    password: password
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10   # Максимальное количество соединений
      minimum-idle: 2         # Минимальное количество простаивающих соединений
      idle-timeout: 10000     # Тайм-аут простоя (в миллисекундах)
      max-lifetime: 1800000   # Максимальное время жизни соединения (в миллисекундах)
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.H2Dialect
      properties:
        hibernate:
          show_sql: true
          format_sql: true
          use_sql_comments: true
          jdbc:
            batch_size: 1000  # Batch size for inserts
          order_inserts: true  # Order inserts to optimize batch processing

    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true