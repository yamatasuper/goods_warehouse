spring:
  datasource:
    url: jdbc:h2:file:./data/goods-warehouse;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  liquibase:
    enabled: true  # Включаем Liquibase для миграций
    change-log: classpath:/db/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
      dialect: org.hibernate.dialect.H2Dialect
      properties:
        hibernate:
          show_sql: true
          format_sql: true
          use_sql_comments: true
          order_inserts: true  # Order inserts to optimize batch processing
currency-service:
  host: http://localhost:8081
  methods:
    get-currency: /api/v1/currencies
server:
  port: 8083  # Установите желаемый порт


